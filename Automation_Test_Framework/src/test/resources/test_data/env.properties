base.url=http://localhost:4200
browser=chrome
headless=false

db.url=jdbc:mysql://localhost:3306/petclinic
db.username=petclinic
db.password=replace-with-local-password

# If we hardcoded the URL for example, that would mean every class must change when the env changes.
# Instead, the test reads it from a centralized configuration source.
# We can later override these settings from maven or jenkins:
# mvn test -Dbrowser=chrome -Dheadless=true